title   kiro install medium (%ARCH%, UEFI, NVIDIA proprietary, modern - keeps nvidia)
sort-key 02
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% driver=nonfree nvidia nvidia-drm.modeset=1 nouveau.modeset=0 radeon.modeset=1 i915.modeset=1 module_blacklist=pcspkr,nouveau quiet splash loglevel=3 %KERNEL_PARAMS%
